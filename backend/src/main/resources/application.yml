server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fittrack}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  flyway:
    enabled: true
app:
  jwt-secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
  access-ttl: PT15M
  refresh-ttl: P30D
  storage-path: ${STORAGE_PATH:./private-storage}
  ai-base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  ai-key: ${OPENAI_API_KEY:}
  ai-vision-model: ${AI_VISION_MODEL:gpt-4o-mini}
  ai-text-model: ${AI_TEXT_MODEL:gpt-4o-mini}
  # Phase 22: model identifiers this deployment may select. Startup fails if either configured
  # model is absent from the list, so a typo stops the boot instead of becoming a billed 502.
  # Extend this list - not the code - when the provider gains a model you intend to use.
  ai-supported-models: ${AI_SUPPORTED_MODELS:gpt-4o-mini}
  # Phase 9 Coach: a bounded interactive budget, separate from the scanner's.
  # 20s is an interactive request budget; the scanner keeps the longer provider read timeout.
  ai-coach-timeout-ms: ${AI_COACH_TIMEOUT_MS:20000}
  ai-limits:
    requests-per-minute: ${AI_REQUESTS_PER_MINUTE:10}
    requests-per-day: ${AI_REQUESTS_PER_DAY:100}
    # Phase 22: shipped as 0, which AiUsageService reads as "unlimited" and
    # ProductionConfigValidator reads as "must be set" - so a deployment that did not opt in got
    # either an uncapped token budget outside production or a refused startup inside it. 100000
    # is the figure this documentation already specified as the production ceiling. The
    # validator still refuses <= 0; this only removes the need to set it. Set 0 to restore the
    # previous "unlimited" behaviour.
    tokens-per-day: ${AI_TOKENS_PER_DAY:100000}
    # Phase 22: pricing is DEPLOYMENT-SUPPLIED and defaults to 0. estimated_cost is an
    # APPLICATION-SIDE ESTIMATE from these two numbers, never provider billing. This repository
    # holds no price list for any model, so no default is asserted - inventing one would put a
    # fabricated figure in an accounting column. Operators set both from the provider's current
    # published rates. With both at 0 the arithmetic is skipped and estimated_cost stays null,
    # while tokens are still recorded.
    pricing:
      input-per-million: ${AI_INPUT_PRICE_PER_MILLION:0}
      output-per-million: ${AI_OUTPUT_PRICE_PER_MILLION:0}
  # Phase 12 reminder scheduler. The poll runs the delivery pipeline that already exists; it does not
  # decide what is due or how to send anything.
  #   enabled   false leaves due reminders untouched - no delivery, no rescheduling. The bean still
  #             exists, so this is a switch rather than a different build.
  #   interval  fixed delay between the END of one pass and the start of the next, so a slow provider
  #             cannot make passes pile up on each other. The first pass also waits one interval, which
  #             gives a starting instance time to come up before it works through a backlog.
  #             ISO-8601 duration, accepted by Spring's scheduled-task parsing.
  reminders:
    scheduler:
      enabled: ${REMINDER_SCHEDULER_ENABLED:true}
      interval: ${REMINDER_SCHEDULER_INTERVAL:PT60S}
  # Phase 13 Web Push. Off by default, so a deployment that sets nothing behaves exactly as it did
  # before push existed: reminders still schedule, delivery still runs, and the occurrence closes
  # through the existing permanent-failure path rather than being retried against a channel that does
  # not exist. Incomplete VAPID configuration disables delivery instead of failing startup, so a
  # missing secret degrades one feature rather than taking down every endpoint.
  #   subject    operator contact for the push service, per RFC 8292 (mailto: or https:). Never a
  #              user's address.
  #   public-key  handed to the browser so it can subscribe. Public by definition.
  #   private-key signs the VAPID JWT. Server-side only: it is never returned by any endpoint and
  #              never logged. Generate a pair with:
  #              openssl ecparam -genkey -name prime256v1 -noout | openssl ec -pubout
  push:
    enabled: ${FITTRACK_PUSH_ENABLED:false}
    vapid:
      subject: ${FITTRACK_VAPID_SUBJECT:mailto:ops@fittrack.example}
      public-key: ${FITTRACK_VAPID_PUBLIC_KEY:}
      private-key: ${FITTRACK_VAPID_PRIVATE_KEY:}
  # Phase 16 production hardening.
  # production=true enables secret validation, HSTS, and prod-only CORS rules. It must be set in
  # every real deployment; it is false locally and in tests.
  production: ${APP_PRODUCTION:false}
  cors:
    # Explicit origins only. A wildcard is never valid here because credentials are enabled.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    health-connect:
      # D7. The initial sync window, in local days. Bounds how far back ingestion will accept, so a
      # bridge cannot make the server retain unbounded history and the aggregation window stays the
      # one the product decided on.
      window-days: ${HEALTH_CONNECT_WINDOW_DAYS:30}
  # D8. FitTrack's own application safety limits, NOT Google quota claims. Google publishes no
  # documented Health Connect quota these would correspond to, and none is implied here.
  #   max-body-bytes  rejects an oversized upload at the container, before the body is buffered, so
  #                   an oversized request never becomes unbounded server memory.
  #   max-records     bounds one batch; enforced in HealthConnectIngestService with a 413 response.
  health-connect-limits:
    max-body-bytes: ${HEALTH_CONNECT_MAX_BODY_BYTES:1048576}
    max-records: ${HEALTH_CONNECT_MAX_RECORDS:500}
  rate-limit:
    # Transport-level abuse protection, separate from the AI quotas above.
    auth-requests: ${RATE_LIMIT_AUTH_REQUESTS:10}
    auth-window-seconds: ${RATE_LIMIT_AUTH_WINDOW:60}
    api-requests: ${RATE_LIMIT_API_REQUESTS:300}
    api-window-seconds: ${RATE_LIMIT_API_WINDOW:60}
    ai-requests: ${RATE_LIMIT_AI_REQUESTS:20}
    ai-window-seconds: ${RATE_LIMIT_AI_WINDOW:60}
    # Phase 9 Coach. Deliberately its own bucket: this is transport protection for the Coach
    # endpoint and is independent of the AI quota in AiUsageService, which is what actually bounds
    # provider consumption. The two are different layers, not conflicting values.
    coach-requests: ${RATE_LIMIT_COACH_REQUESTS:20}
    coach-window-seconds: ${RATE_LIMIT_COACH_WINDOW:60}
    # Phase 11 health ingestion. Its own bucket because it is a batch write path, and keyed by user
    # rather than by device: one user with several Android devices is still one client.
    health-requests: ${RATE_LIMIT_HEALTH_REQUESTS:60}
    health-window-seconds: ${RATE_LIMIT_HEALTH_WINDOW:60}
    # Phase 14. Push subscription registration and removal are user-triggered writes to PostgreSQL and
    # get their own bucket rather than sharing the general API allowance, so a tighter limit can be
    # applied without changing ordinary read traffic. Keyed by user, so one account cannot exhaust
    # another's budget. See docs/push-acceptance.md.
    push-requests: ${RATE_LIMIT_PUSH_REQUESTS:20}
    push-window-seconds: ${RATE_LIMIT_PUSH_WINDOW:60}
    # When true the limiter uses Redis for shared state across instances. With Redis configured but
    # unreachable, authentication limits fail closed and general API limits fail open.
    redis-enabled: ${RATE_LIMIT_REDIS_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        # Only health. Never env, configprops, beans, loggers, mappings or heapdump.
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      group:
        # Explicit groups so /actuator/health/liveness and /readiness are always available, not only
        # where availability probes are auto-detected. Liveness never checks dependencies, so a
        # database blip does not cause a restart loop; readiness does, so traffic drains first.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  health:
    redis:
      # Spring's auto-configured indicator would report DOWN when Redis is absent. Redis is
      # optional here (the limiter falls back to in-process state), so it is disabled and the
      # Phase 16 RedisHealthIndicator reports UNKNOWN until RATE_LIMIT_REDIS_ENABLED=true.
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    probes:
      # Explicit group definitions so /actuator/health/liveness and /readiness exist in every
      # environment, not only where availability probes are auto-detected.
      enabled: true
  info:
    env:
      enabled: false
  metrics:
    tags:
      application: fittrack-backend
logging:
  pattern:
    # Correlation id first so log lines can be joined to a request and to an error response.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level correlation=%X{request_id:-none} logger=%logger{36} error_type=%X{error_type:-none} msg=%msg%n"

